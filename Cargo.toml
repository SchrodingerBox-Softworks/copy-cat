[package]
name = "copy-cat"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow", "persistence"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.19"
arboard = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[build-dependencies]
winresource = "0.1"

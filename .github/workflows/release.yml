name: Release

# Запускается ТОЛЬКО когда в репозиторий пушат тег вида `v1.2.3`.
#
# Заголовок и текст релиза берутся из аннотации тега, поэтому имя релиза
# задаётся при создании тега:
#
#   git tag -a v0.2.0 -m "Поиск по истории"
#   git push origin v0.2.0
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: copy-cat

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история + теги: нужны, чтобы прочитать аннотацию тега.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked --verbose

      - name: Run tests
        run: cargo test --release --locked --verbose

      - name: Read tag annotation
        id: tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          git for-each-ref "refs/tags/${TAG}" --format='%(contents)' > TAG_MESSAGE.txt
          if [ ! -s TAG_MESSAGE.txt ] || ! grep -q '[^[:space:]]' TAG_MESSAGE.txt; then
            git log -1 --format=%B "${TAG}" > TAG_MESSAGE.txt
          fi
          head -n 1 TAG_MESSAGE.txt > TAG_SUBJECT.txt
          tail -n +2 TAG_MESSAGE.txt > TAG_BODY.txt
          echo "subject=$(cat TAG_SUBJECT.txt)" >> "$GITHUB_OUTPUT"

      - name: Package artifacts
        id: package
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          ASSET="${BIN_NAME}-${TAG}-x86_64-windows.exe"
          cp "target/release/${BIN_NAME}.exe" "$ASSET"
          HASH=$(sha256sum "$ASSET" | awk '{print $1}')
          echo "${HASH}  ${ASSET}" > "${ASSET}.sha256"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "sha256=$HASH" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        shell: bash
        run: |
          {
            if grep -q '[^[:space:]]' TAG_BODY.txt; then
              cat TAG_BODY.txt
              echo
            fi
            echo "## Установка"
            echo
            echo "Скачайте \`${{ steps.package.outputs.asset }}\`, положите в любую папку и запустите."
            echo "Настройки и история сохраняются рядом с \`.exe\`."
            echo
            echo "---"
            echo
            echo "**SHA256** (\`${{ steps.package.outputs.asset }}\`)"
            echo
            echo "\`\`\`"
            echo "${{ steps.package.outputs.sha256 }}"
            echo "\`\`\`"
          } > RELEASE_BODY.md
          cat RELEASE_BODY.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ github.ref_name }} — ${{ steps.tag.outputs.subject }}"
          body_path: RELEASE_BODY.md
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256

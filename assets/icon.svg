<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1024 1024"
     role="img"
     aria-labelledby="title desc">
  <title id="title">CopyCat application icon</title>
  <desc id="desc">A cat-shaped clipboard history card with a duplicated card behind it</desc>

  <defs>
    <linearGradient id="background" x1="160" y1="120" x2="864" y2="920"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2D3164"/>
      <stop offset="1" stop-color="#15172D"/>
    </linearGradient>

    <linearGradient id="copyCard" x1="330" y1="150" x2="850" y2="800"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#36E0CF"/>
      <stop offset="1" stop-color="#23AFC9"/>
    </linearGradient>

    <linearGradient id="accent" x1="470" y1="500" x2="550" y2="570"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9A7CFF"/>
      <stop offset="1" stop-color="#6D55E8"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect x="56" y="56" width="912" height="912" rx="232"
        fill="url(#background)"/>

  <rect x="64" y="64" width="896" height="896" rx="224"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.08"
        stroke-width="16"/>

  <!-- Subtle decoration -->
  <circle cx="190" cy="178" r="68" fill="#FFFFFF" opacity="0.035"/>
  <circle cx="850" cy="840" r="110" fill="#36E0CF" opacity="0.045"/>

  <!-- Shadow -->
  <path
    d="M277 840
       C222 840 178 796 178 741
       V390
       C178 352 199 320 230 304
       L244 200
       C248 170 282 157 305 177
       L399 258
       C472 238 552 238 625 258
       L719 177
       C742 157 776 170 780 200
       L794 304
       C825 320 846 352 846 390
       V741
       C846 796 802 840 747 840
       Z"
    transform="translate(0 24)"
    fill="#080A18"
    opacity="0.32"/>

  <!-- Copied card behind -->
  <path
    d="M277 840
       C222 840 178 796 178 741
       V390
       C178 352 199 320 230 304
       L244 200
       C248 170 282 157 305 177
       L399 258
       C472 238 552 238 625 258
       L719 177
       C742 157 776 170 780 200
       L794 304
       C825 320 846 352 846 390
       V741
       C846 796 802 840 747 840
       Z"
    transform="translate(66 -42)"
    fill="url(#copyCard)"/>

  <!-- Main cat/card -->
  <path
    d="M277 840
       C222 840 178 796 178 741
       V390
       C178 352 199 320 230 304
       L244 200
       C248 170 282 157 305 177
       L399 258
       C472 238 552 238 625 258
       L719 177
       C742 157 776 170 780 200
       L794 304
       C825 320 846 352 846 390
       V741
       C846 796 802 840 747 840
       Z"
    fill="#F8FAFF"/>

  <!-- Inner ears -->
  <path d="M276 235 L342 291 C313 299 286 312 263 330 Z"
        fill="#DCD8FF"/>
  <path d="M748 235 L682 291 C711 299 738 312 761 330 Z"
        fill="#DCD8FF"/>

  <!-- Eyes -->
  <ellipse cx="365" cy="445" rx="31" ry="43" fill="#202440"/>
  <ellipse cx="659" cy="445" rx="31" ry="43" fill="#202440"/>

  <ellipse cx="365" cy="445" rx="8" ry="21" fill="#36D7C9"/>
  <ellipse cx="659" cy="445" rx="8" ry="21" fill="#36D7C9"/>

  <!-- Nose and mouth -->
  <path d="M512 506 L474 535 Q512 570 550 535 Z"
        fill="url(#accent)"/>

  <path d="M512 558
           C500 584 476 590 452 577
           M512 558
           C524 584 548 590 572 577"
        fill="none"
        stroke="#202440"
        stroke-width="16"
        stroke-linecap="round"/>

  <!-- Whiskers -->
  <path d="M421 526 L278 497
           M419 552 L267 552
           M603 526 L746 497
           M605 552 L757 552"
        fill="none"
        stroke="#202440"
        stroke-opacity="0.78"
        stroke-width="17"
        stroke-linecap="round"/>

  <!-- Clipboard history rows -->
  <rect x="284" y="642" width="56" height="56" rx="17"
        fill="#2FD1C3"/>
  <rect x="370" y="642" width="354" height="23" rx="11.5"
        fill="#252A49"/>
  <rect x="370" y="678" width="246" height="16" rx="8"
        fill="#9CA3BC"/>

  <rect x="284" y="735" width="56" height="56" rx="17"
        fill="#8067F2"/>
  <rect x="370" y="735" width="300" height="23" rx="11.5"
        fill="#252A49"/>
  <rect x="370" y="771" width="196" height="16" rx="8"
        fill="#9CA3BC"/>
</svg>
